name: Bug report
description: Something returned the wrong result, crashed, or did not match the docs.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you sent, what you expected, and what you got instead. Include the x-llm-gateway-* response headers if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command or request and a minimal config. Remove API keys and do not paste confidential prompts.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - mock (default)
        - openai or OpenAI-compatible
        - anthropic
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "node --version"
